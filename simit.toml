[ci]
platform = "github"
provider = "actions"
runner = "ubuntu-latest"
workspace = true
workspace_strategy = "aggregate"
all_features = false
extra_setup = ["git submodule update --init --recursive", "sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev libgles2-mesa-dev libgbm-dev mesa-utils libfreetype-dev libfontconfig1-dev fonts-noto-cjk"]
